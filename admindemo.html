<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Tracker Dashboard - LIVE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
    </style>

    <!-- SUPABASE SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="p-4 md:p-12">

    <div class="max-w-5xl mx-auto">
        <!-- HEADER -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 gap-6 md:gap-0">
            
            <!-- Sisi Kiri: Judul -->
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center text-2xl shadow-md shrink-0">
                    <i class="fa-solid fa-chart-simple"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg md:text-xl text-slate-800 tracking-tight leading-none">Demo Tracker</h1>
                    <p class="text-[10px] md:text-xs text-slate-500 font-medium uppercase tracking-wider mt-1.5">Quick Selection & Sorter</p>
                </div>
            </div>
            
            <!-- Sisi Kanan: Panel Statistik -->
            <div class="flex items-center justify-between md:justify-end w-full md:w-auto gap-6 border-t md:border-t-0 border-slate-100 pt-4 md:pt-0">
                
                <!-- ANGKA PENGUNJUNG ONLINE SAAT INI -->
                <div class="text-left md:text-right border-r border-slate-200 pr-6">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5 flex items-center justify-start md:justify-end gap-1.5">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                        </span>
                        Sedang Online
                    </p>
                    <p class="text-3xl font-black text-green-500 leading-none" id="onlineCount">0</p>
                </div>

                <!-- TOTAL PENGUNJUNG YANG TERCATAT DI DATABASE -->
                <div class="text-left md:text-right">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Total Visitor</p>
                    <p class="text-3xl font-black text-blue-600 leading-none" id="totalCount">0</p>
                </div>

                <!-- Tombol Refresh manual -->
                <button onclick="fetchData()" class="w-12 h-12 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-xl transition flex items-center justify-center shadow-sm border border-slate-200 shrink-0" title="Refresh Data Manual">
                    <i class="fa-solid fa-rotate-right" id="refreshIcon"></i>
                </button>
            </div>
        </div>

        <!-- TABLE SECTION -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-[10px] md:text-xs uppercase tracking-wider">
                            <th class="px-4 md:px-6 py-4 font-bold w-12 md:w-16 text-center">No</th>
                            <th class="px-4 md:px-6 py-4 font-bold">IP Address Visitor</th>
                            <th class="px-4 md:px-6 py-4 font-bold">Waktu Akses (WIB)</th>
                            <th class="px-4 md:px-6 py-4 font-bold text-center w-20 md:w-28">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm divide-y divide-slate-100">
                        <!-- Data akan dirender disini oleh Javascript -->
                        <tr>
                            <td colspan="4" class="px-6 py-8 text-center text-slate-400">
                                <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Sedang mengambil data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <p class="text-center text-xs text-slate-400 mt-6">Halaman ini otomatis mendeteksi pengunjung baru dan status online secara Real-time.</p>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        const supabaseUrl = 'https://ygoawyedjxcxxnhlbtit.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlnb2F3eWVkanhjeHhuaGxidGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTQ1NDMsImV4cCI6MjEwMjgzMDU0M30.qBH1iyMv_RWMUkgZMVd-YP0mJfp-ATUqfHZU7nzclUc';
        
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        function formatTanggalIndo(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('id-ID', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                timeZoneName: 'short'
            });
        }

        // FUNGSI MENGHAPUS DATA
        async function hapusData(ipTarget) {
            const konfirmasi = confirm(`Yakin ingin menghapus IP ${ipTarget}?\n\nJika dihapus, perangkat ini akan bisa mencoba aplikasi demo lagi.`);
            if (!konfirmasi) return; 

            try {
                document.body.style.cursor = 'wait';
                const { error } = await db.from('demo_tracking').delete().eq('ip_address', ipTarget);
                
                if (error) {
                    console.error('Error saat menghapus:', error);
                    alert("Gagal menghapus data. Periksa koneksi Anda.");
                }

            } catch (err) {
                alert("Terjadi kesalahan sistem.");
            } finally {
                document.body.style.cursor = 'default';
            }
        }

        // FUNGSI MENARIK DATA TABEL PENGUNJUNG
        async function fetchData() {
            const tbody = document.getElementById('tableBody');
            const totalCount = document.getElementById('totalCount');
            const icon = document.getElementById('refreshIcon');

            icon.classList.add('fa-spin');
            
            try {
                const { data, error } = await db
                    .from('demo_tracking')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Error fetching data:', error);
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-red-500 font-bold">Gagal menarik data. Pastikan koneksi internet aktif.</td></tr>`;
                    return;
                }

                totalCount.innerText = data.length;

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500 font-medium">Belum ada pengunjung yang mencoba aplikasi demo ini.</td></tr>`;
                } else {
                    tbody.innerHTML = ''; 
                    data.forEach((row, index) => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-50 transition-colors";
                        
                        tr.innerHTML = `
                            <td class="px-4 md:px-6 py-4 font-medium text-slate-400 text-center">${index + 1}</td>
                            <td class="px-4 md:px-6 py-4 font-bold text-slate-700 font-mono text-xs md:text-sm">${row.ip_address}</td>
                            <td class="px-4 md:px-6 py-4 text-slate-500 text-xs md:text-sm">${formatTanggalIndo(row.created_at)}</td>
                            <td class="px-4 md:px-6 py-4 text-center">
                                <button onclick="hapusData('${row.ip_address}')" class="w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 text-red-500 hover:text-red-700 transition flex items-center justify-center mx-auto border border-red-200" title="Hapus IP ini">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error("Terjadi kesalahan sistem:", err);
            } finally {
                setTimeout(() => { icon.classList.remove('fa-spin'); }, 500);
            }
        }

        // ==========================================
        // FITUR REAL-TIME LISTENER & PRESENCE (ONLINE STATUS)
        // ==========================================
        function aktifkanRealtime() {
            // 1. Radar Database (Untuk Total Visitor & Data Baru/Hapus)
            db.channel('pemantau_demo_admin')
              .on(
                'postgres_changes',
                { event: '*', schema: 'public', table: 'demo_tracking' },
                (payload) => {
                  fetchData(); 
                }
              )
              .subscribe();

            // 2. Radar Presence (Orang Yang Sedang Buka Aplikasi Saat Ini)
            const room = db.channel('online_visitors');
            
            room.on('presence', { event: 'sync' }, () => {
                const newState = room.presenceState();
                let onlineCount = 0;
                // Hitung total client (tab browser) yang terkoneksi
                for (let id in newState) {
                    onlineCount += newState[id].length;
                }
                // Update angka di layar
                document.getElementById('onlineCount').innerText = onlineCount;
            }).subscribe();
        }

        window.onload = () => {
            fetchData();
            aktifkanRealtime(); 
        };
    </script>
</body>
</html>
