<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Tracker Dashboard - LIVE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
    </style>

    <!-- SUPABASE SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-5xl mx-auto">
        <!-- HEADER -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 relative overflow-hidden">
            
            <!-- INDIKATOR LIVE REAL-TIME -->
            <div class="absolute top-4 right-6 flex items-center gap-2">
                <span class="text-[10px] font-bold text-green-500 tracking-wider">LIVE UPDATE</span>
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
            </div>

            <div class="flex items-center gap-4 mb-4 md:mb-0 mt-2 md:mt-0">
                <div class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center text-2xl shadow-md">
                    <i class="fa-solid fa-chart-simple"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl text-slate-800 tracking-tight">Demo Tracker Dashboard</h1>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Quick Selection & Sorter</p>
                </div>
            </div>
            
            <div class="flex items-center gap-6 mt-2 md:mt-0">
                <div class="text-right mr-4 md:mr-0">
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Total Visitor Demo</p>
                    <p class="text-3xl font-black text-blue-600" id="totalCount">0</p>
                </div>
                <!-- Tombol Refresh manual tetap disisakan untuk jaga-jaga -->
                <button onclick="fetchData()" class="w-12 h-12 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition flex items-center justify-center shadow-inner border border-slate-200" title="Refresh Data Manual">
                    <i class="fa-solid fa-rotate-right" id="refreshIcon"></i>
                </button>
            </div>
        </div>

        <!-- TABLE SECTION -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider">
                            <th class="px-6 py-4 font-bold w-16 text-center">No</th>
                            <th class="px-6 py-4 font-bold">IP Address Visitor</th>
                            <th class="px-6 py-4 font-bold">Waktu Akses (WIB)</th>
                            <th class="px-6 py-4 font-bold text-center w-28">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm divide-y divide-slate-100">
                        <!-- Data akan dirender disini oleh Javascript -->
                        <tr>
                            <td colspan="4" class="px-6 py-8 text-center text-slate-400">
                                <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Sedang mengambil data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <p class="text-center text-xs text-slate-400 mt-6">Halaman ini otomatis mendeteksi pengunjung baru secara Real-time.</p>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        const supabaseUrl = 'https://ygoawyedjxcxxnhlbtit.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlnb2F3eWVkanhjeHhuaGxidGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTQ1NDMsImV4cCI6MjEwMjgzMDU0M30.qBH1iyMv_RWMUkgZMVd-YP0mJfp-ATUqfHZU7nzclUc';
        
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        function formatTanggalIndo(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('id-ID', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                timeZoneName: 'short'
            });
        }

        // FUNGSI MENGHAPUS DATA
        async function hapusData(ipTarget) {
            const konfirmasi = confirm(`Yakin ingin menghapus IP ${ipTarget}?\n\nJika dihapus, perangkat ini akan bisa mencoba aplikasi demo lagi.`);
            if (!konfirmasi) return; 

            try {
                document.body.style.cursor = 'wait';
                const { error } = await db.from('demo_tracking').delete().eq('ip_address', ipTarget);
                
                if (error) {
                    console.error('Error saat menghapus:', error);
                    alert("Gagal menghapus data. Periksa koneksi Anda.");
                }
                // Catatan: Kita tidak perlu memanggil fetchData() di sini 
                // karena fitur Real-time (di bawah) akan otomatis mendeteksi 
                // bahwa data terhapus dan merefresh tabel dengan sendirinya!

            } catch (err) {
                alert("Terjadi kesalahan sistem.");
            } finally {
                document.body.style.cursor = 'default';
            }
        }

        // FUNGSI MENARIK DATA
        async function fetchData() {
            const tbody = document.getElementById('tableBody');
            const totalCount = document.getElementById('totalCount');
            const icon = document.getElementById('refreshIcon');

            icon.classList.add('fa-spin');
            
            try {
                const { data, error } = await db
                    .from('demo_tracking')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Error fetching data:', error);
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-red-500 font-bold">Gagal menarik data. Pastikan koneksi internet aktif.</td></tr>`;
                    return;
                }

                totalCount.innerText = data.length;

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500 font-medium">Belum ada pengunjung yang mencoba aplikasi demo ini.</td></tr>`;
                } else {
                    tbody.innerHTML = ''; 
                    data.forEach((row, index) => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-50 transition-colors";
                        
                        tr.innerHTML = `
                            <td class="px-6 py-4 font-medium text-slate-400 text-center">${index + 1}</td>
                            <td class="px-6 py-4 font-bold text-slate-700 font-mono">${row.ip_address}</td>
                            <td class="px-6 py-4 text-slate-500">${formatTanggalIndo(row.created_at)}</td>
                            <td class="px-6 py-4 text-center">
                                <button onclick="hapusData('${row.ip_address}')" class="w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 text-red-500 hover:text-red-700 transition flex items-center justify-center mx-auto border border-red-200" title="Hapus IP ini">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error("Terjadi kesalahan sistem:", err);
            } finally {
                setTimeout(() => { icon.classList.remove('fa-spin'); }, 500);
            }
        }

        // ==========================================
        // FITUR REAL-TIME LISTENER
        // ==========================================
        function aktifkanRealtime() {
            // Membuka jalur komunikasi websocket ke Supabase
            db.channel('pemantau_demo_admin')
              .on(
                'postgres_changes',
                { event: '*', schema: 'public', table: 'demo_tracking' },
                (payload) => {
                  console.log('Terjadi perubahan di database!', payload);
                  // Otomatis muat ulang tabel setiap kali ada pengunjung baru yang tercatat (INSERT) 
                  // atau setiap kali Anda menghapus data (DELETE)
                  fetchData(); 
                }
              )
              .subscribe();
        }

        // Panggil fungsi saat pertama kali halaman dibuka
        window.onload = () => {
            fetchData();
            aktifkanRealtime(); // Jalankan radar real-time!
        };
    </script>
</body>
</html>
